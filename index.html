<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Bonito Escudo — Mini juego Phaser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="wrap">
    <header class="hud">
      <span id="score">Puntos: 0</span>
      <span id="lives">❤️❤️❤️</span>
    </header>
    <div id="game"></div>
    <p class="hint">
      Toca la pantalla: el escudo del conejo tiene 8 direcciones (incluye diagonales) y bloquea las balas del lado al que apunta.
      <span class="hint-stats"><span id="stat-high">Mejor puntuación: 0</span> · <span id="stat-last">Ronda anterior: —</span></span>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
